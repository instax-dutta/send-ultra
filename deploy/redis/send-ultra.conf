# Redis for Send Ultra. Loopback only; nothing outside this host should reach it.
bind 127.0.0.1 -::1
port 18101
daemonize yes
pidfile /var/lib/send-ultra-redis/send-ultra.pid
dir /var/lib/send-ultra-redis
dbfilename send-ultra.rdb

# Snapshotting as well as the AOF. Cheap insurance: if the AOF is ever unreadable,
# the RDB is still there.
save 900 1

# Append-only file. This is what actually bounds the loss after a crash: with RDB
# alone, up to fifteen minutes of uploads can be forgotten, and those links 404
# while their ciphertext sits on disk untouched.
#
# everysec trades at most a second of acknowledged writes for one fsync per
# second. For a few live uploads the write volume is negligible.
appendonly yes
appendfsync everysec

# Never evict. Redis here is the record of which files exist; silently dropping
# keys to stay under a memory cap would delete links without deleting anything
# from disk.
maxmemory-policy noeviction

# Without this the unit's --daemonize means startup messages go nowhere, and a
# dataset that fails to load leaves no trace to diagnose it by.
logfile /var/log/redis/send-ultra.log
